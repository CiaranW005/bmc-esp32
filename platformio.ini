; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32s3

[env:esp32s3]
platform =  https://github.com/pioarduino/platform-espressif32.git
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; These paths identify this specific board. Update both when using another device.
monitor_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_98:C3:77:B3:DC:3C-if00 
upload_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_98:C3:77:B3:DC:3C-if00

lib_deps =
    links2004/WebSockets
    bblanchon/ArduinoJson
    adafruit/Adafruit NeoPixel

; Replace the default C++11 setting with C++17 for optional, variant,
; structured bindings, and compile-time packet dispatch.
build_unflags =
    -std=gnu++11

build_flags =
    -std=gnu++17
    -D LOGGER_USE_UDP
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    
; build_flags =
;     -D DEBUG_ESP_PORT=Serial

; Connect to the local Oracle endpoint over plain WebSocket instead of
; production TLS with a client certificate. Bearer authentication is still used.
[env:esp32s3-local]
extends = env:esp32s3
build_flags =
    ${env:esp32s3.build_flags}
    -D ORACLE_LOCAL